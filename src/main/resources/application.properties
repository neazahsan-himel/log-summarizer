spring.application.name=log-summarizer
# Prefer servlet (Tomcat) when both webmvc and webflux are on the classpath
spring.main.web-application-type=servlet

# AI provider selection
ai.provider=ollama
ai.ollama.base-url=http://localhost:11434
ai.ollama.model=llama3.2:1b
ai.ollama.timeout-seconds=30
ai.ollama.num-ctx=4096
