services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-summarizer
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_OLLAMA_BASE_URL: ${AI_OLLAMA_BASE_URL:-http://ollama:11434}
      AI_OLLAMA_MODEL: ${AI_OLLAMA_MODEL:-llama3}
      AI_OLLAMA_TIMEOUT_SECONDS: ${AI_OLLAMA_TIMEOUT_SECONDS:-30}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai-net
    restart: on-failure

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ai-net
    restart: unless-stopped

volumes:
  ollama-models:

networks:
  ai-net:
    driver: bridge